[package]
name = "mangodisk-mcp"
version.workspace = true
description = "MangoDisk Model Context Protocol server adapter"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "mangodisk-mcp"
path = "src/main.rs"

[dependencies]
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
log = "0.4.33"
mangodisk-core = { path = "../mangodisk-core" }
mangodisk-platform = { path = "../mangodisk-platform" }
# Pinned: the rmcp API is still evolving; upgrade deliberately.
rmcp = { version = "=3.1.4", features = ["transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = "0.7"
tower-service = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "process"] }
