# Chrome keeps cookies, history, passwords, and extensions under the XDG config
# user-data directory. This rule owns only the dedicated XDG cache tree.
id = "browser.chrome-cache"
schema_version = 3
rule_version = 1
platform = "linux"
category = "browser"
risk = "safe"
default_selected = true
required_stopped_processes = ["google-chrome", "chrome"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["com.google.Chrome", "Google Chrome", "google-chrome"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${xdg_cache_home}/google-chrome"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Chromium documents the Linux cache directory as a location separate from the XDG config user-data profile; cookies, history, passwords, bookmarks, extensions, and other durable profile data remain outside the selected root"
verified_at = "2026-08-26"
verified_platform = "linux"
references = [
  "https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md",
  "https://support.google.com/accounts/answer/32050",
]
